user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

# ─── HTTP 反代(80/443) ───
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 64m;        # 与 n9e MaxContentLength = 67108864 对齐
    server_tokens off;
    # ===== 等保2.0 基线加固(全局;限流仅在 443 生效,17000 agent 入口不限)=====
    client_body_timeout   60s;
    client_header_timeout 60s;
    send_timeout          60s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_rate 0;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    include /etc/nginx/conf.d/*.conf;
    # agent 接口入口 17000(由 templates/agent-api.conf.template 在容器启动时渲染)
    include /etc/nginx/agent-api*.conf;
}

# ─── TCP stream(ibex RPC 20090 透传) ───
stream {
    upstream ibex_rpc {
        server n9e:20090;
    }
    server {
        listen 20090;
        proxy_pass ibex_rpc;
        proxy_timeout 1h;
        proxy_connect_timeout 5s;
    }
}
