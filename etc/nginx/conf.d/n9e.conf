# 80 → 443 强跳
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# 443 主站
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # 4.2 渗透修复:禁危险方法 TRACE/TRACK(防 XST);PUT/DELETE 是 n9e 正常 RESTful 操作,保留
    if ($request_method ~* ^(TRACE|TRACK)$) { return 405; }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # 远程漏洞修复(R03):拦截 /metrics 未授权暴露
    location = /metrics { return 403; }

    # ===== 等保2.0 基线加固(仅 443 人访问面)=====
    limit_conn perip 200;
    error_page 400 401 403 404 500 502 503 504 /_n9e_err;
    location = /_n9e_err { internal; default_type text/plain; return 200 "error\n"; }
    location ~ /\.(?!well-known) { deny all; }

    # 4.3 渗透修复:HTTP Host 头攻击向量在语音接口——原配置 proxy_set_header Host $http_host
    # 把客户端(攻击者)原始 Host 透传给后端,导致生成含恶意 Host 的链接。语音功能当前不使用,
    # 直接封禁该接口以根除该漏洞;将来恢复语音需改用可信 Host(SERVER_NAME)再放开。
    location ^~ /api/n9e/assistant/voice { return 403; }

    # n9e 业务 API + 嵌入式前端
    location / {
        proxy_pass http://n9e:17000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # 长轮询 / SSE:
    #   - /api/n9e/agent/bundle              cfgsync host 侧 config-sync 长轮询
    #   - /api/n9e/event-pipeline/:id/stream 事件管道 SSE
    # 关 buffering,延长 read_timeout,避免被 nginx 截断
    location ~ ^/api/n9e/(agent/bundle|event-pipeline/[^/]+/stream)$ {
        proxy_pass http://n9e:17000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
