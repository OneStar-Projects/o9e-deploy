name: n9e-single

networks:
  n9e:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  vm-data:
  n9e-logs:
  scanopy-postgres-data:
  scanopy-daemon-config:
  es-data:

services:
  mysql:
    image: mysql:8.0
    # 内置 MySQL,属于 builtin-db profile(.env 默认 COMPOSE_PROFILES=builtin-db)。
    # 使用外部数据库(客户提供的 MySQL / PostgreSQL / 金仓)时从 COMPOSE_PROFILES 去掉 builtin-db,本服务不再启动。
    profiles: ["builtin-db"]
    container_name: o9e-mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # root 只建 root@localhost(容器内 socket 登录),不建可远程登录的 root@'%'
      MYSQL_ROOT_HOST: localhost
      # 供 initsql-extra/f-app-users.sh 建业务账号
      N9E_DB_USER:      ${N9E_DB_USER}
      N9E_DB_PASSWORD:  ${N9E_DB_PASSWORD}
      TOPO_DB_USER:     ${TOPO_DB_USER}
      TOPO_DB_PASSWORD: ${TOPO_DB_PASSWORD}
      # 新部署时替换 admin 的上游默认弱口令(见 f-app-users.sh)
      N9E_ADMIN_PASSWORD: ${N9E_ADMIN_PASSWORD:-}
    volumes:
      - mysql-data:/var/lib/mysql
      # 上游 schema(批量,initsql/ 是 nightingale/docker/initsql/ 的真目录副本)
      # 注意:父目录不能加 :ro — 下一行还要在里面挂 d-cfgsync.sql,runc 不允许在只读挂载点上创建子 mountpoint
      - ./initsql:/docker-entrypoint-initdb.d
      # 本仓库 fork 增量,单文件 bind mount,字典序 d- 保证在上游 a-/c- SQL 之后跑(ASCII '0'<'a',原 02- 反而抢跑)
      - ./initsql-extra/d-cfgsync.sql:/docker-entrypoint-initdb.d/d-cfgsync.sql:ro
      # topo-studio 独立库(字典序 e- 在 d- 之后建);仅 CREATE DATABASE,表由 TOPO_DB_MIGRATE 自动建
      - ./initsql-extra/e-topo-studio.sql:/docker-entrypoint-initdb.d/e-topo-studio.sql:ro
      # 业务专用账号 n9e_app / topo_app(字典序 f- 在建库之后)
      - ./initsql-extra/f-app-users.sh:/docker-entrypoint-initdb.d/f-app-users.sh:ro
      - ./etc/mysql/my.cnf:/etc/my.cnf:ro
    networks: [n9e]
    healthcheck:
      # 走 socket(-h localhost)以 root@localhost 检查;root 不再允许经 TCP 登录
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      # 首次启动 mysql 要走完 initdb(创数据目录 ~90s)+ 跑 a-n9e.sql/d-cfgsync.sql(慢盘下可能 1-2 分钟),
      # 老配置 start_period 30s + retries 10 = 130s,擦边超时 → n9e 因 depends_on 卡死。
      # 拉宽到 90s + 60×10s = 690s,给慢盘留余地;次启起来很快,不会真的等满。
      retries: 60
      start_period: 90s

  redis:
    image: redis:7.2-alpine
    container_name: o9e-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks: [n9e]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.93.15
    container_name: o9e-vm
    restart: always
    environment:
      TZ: Asia/Shanghai
    command:
      - "--storageDataPath=/vm-data"
      - "--retentionPeriod=${VM_RETENTION:-3}"
      - "--httpListenAddr=:8428"
      - "--loggerTimezone=Asia/Shanghai"
    volumes:
      - vm-data:/vm-data
    networks: [n9e]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ─── scanopy 服务(网络拓扑发现,fork 版)──────────────────
  # 镜像来自 fork(fuqiangleon/scanopy),由该仓库的 build-images.sh 构建并推 Docker Hub
  #   (含延庆 SNMP 存活兜底改动;server 内含 scanopy 原生 UI)。
  #   镜像用官方名,拉取由 daemon.json 配置的镜像代理透明加速(不再在 compose 写死加速器前缀)。
  # 结构对齐上游 docker-compose:https://github.com/scanopy/scanopy/blob/main/docker-compose.yml
  # n9e 通过 /api/scanopy/* 反代到下面的 scanopy 容器(就是上游的 "server")。
  # daemon 必须 host network + privileged 才能扫描真实网络。
  # 更新镜像:改 .env 的 SCANOPY_TAG(默认 latest)→ docker compose pull scanopy scanopy-daemon && up -d。

  scanopy-daemon:
    image: fuqiangleon/scanopy-daemon:${SCANOPY_TAG:-latest}
    container_name: o9e-scanopy-daemon
    network_mode: host                       # 扫描需要直接看到宿主网卡
    privileged: true                          # daemon 要发起 raw socket / ARP
    restart: always
    environment:
      TZ: Asia/Shanghai
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_SERVER_URL: http://127.0.0.1:60072
    volumes:
      - scanopy-daemon-config:/root/.config/daemon
      # 注释掉下面这行可关闭 Docker 容器拓扑发现
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60073/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  scanopy-postgres:
    image: postgres:17-alpine
    container_name: o9e-scanopy-postgres
    restart: always
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SCANOPY_POSTGRES_PASSWORD}
    volumes:
      - scanopy-postgres-data:/var/lib/postgresql/data
    networks: [n9e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  scanopy:
    # 上游叫 "server",这里保持服务名 "scanopy" 兼容 n9e config:
    #   [Center] ScanopyUrl = "http://scanopy:60072"
    image: fuqiangleon/scanopy-server:${SCANOPY_TAG:-latest}
    container_name: o9e-scanopy
    restart: always
    environment:
      TZ: Asia/Shanghai
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_DATABASE_URL: postgresql://postgres:${SCANOPY_POSTGRES_PASSWORD}@scanopy-postgres:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_PUBLIC_URL: https://${N9E_DOMAIN:-o9e.local}/api/scanopy
      # daemon 跑在 host network,只能通过 host.docker.internal 反查
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
      # bootstrap 脚本走 .env 读这些;透传给容器 env(镜像不一定用,但放着无害)
      SCANOPY_ADMIN_EMAIL:    ${SCANOPY_ADMIN_EMAIL:-}
      SCANOPY_ADMIN_PASSWORD: ${SCANOPY_ADMIN_PASSWORD:-}
      SCANOPY_ORG_NAME:       ${SCANOPY_ORG_NAME:-o9e}
      SCANOPY_NETWORK_NAME:   ${SCANOPY_NETWORK_NAME:-default}
      # 首次部署保持 false 让 bootstrap 能 register admin;之后 ./scanopy-lock-registration.sh 改 true
      SCANOPY_DISABLE_REGISTRATION: ${SCANOPY_DISABLE_REGISTRATION:-false}
      # 走 nginx HTTPS 反代后面,启用 secure cookie
      SCANOPY_USE_SECURE_SESSION_COOKIES: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"     # 让容器解析 host.docker.internal 到宿主网关
    expose:
      - "60072"
    # 默认只绑本机:本机 daemon(host 网络)走 127.0.0.1 即可,UI/API 一律经 nginx 443。
    # 有「不在本机的」daemon 要直连 server 时,在 .env 设 SCANOPY_BIND=0.0.0.0(会绕过 nginx 暴露明文 HTTP)。
    ports:
      - "${SCANOPY_BIND:-127.0.0.1}:${SCANOPY_PORT:-60072}:60072"
    networks: [n9e]
    depends_on:
      scanopy-postgres: { condition: service_healthy }
      scanopy-daemon:   { condition: service_started }
    healthcheck:
      # 镜像内无 wget,只有 curl(对齐上游 daemon healthcheck);端点 /api/v1/health 实测 200
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:60072/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  n9e:
    # 镜像从 Docker Hub 拉取(fuqiangleon/o9e),由 monorepo 的 scripts/build-image.sh
    # 构建并 push。本部署仓库纯 pull,不在现场 build,故无 build 段。
    # 切版本改 .env 的 O9E_TAG,然后 docker compose pull n9e && docker compose up -d n9e。
    image: fuqiangleon/o9e:${O9E_TAG:-latest}
    container_name: o9e
    restart: always
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
      N9E_DB_USER:     ${N9E_DB_USER}
      N9E_DB_PASSWORD: ${N9E_DB_PASSWORD}
      # 数据库类型与连接串(渲染进 config.toml [DB])。默认连内置 MySQL;
      # 外部 PostgreSQL / 金仓由 ./external-db-init.sh 生成 N9E_DB_DSN 写入 .env。
      DB_TYPE:    ${DB_TYPE:-mysql}
      N9E_DB_DSN: ${N9E_DB_DSN:-${N9E_DB_USER}:${N9E_DB_PASSWORD}@tcp(${DB_HOST:-mysql}:${DB_PORT:-3306})/${N9E_DB_NAME:-n9e_v6}?charset=utf8mb4&parseTime=True&loc=Local}
      REDIS_PASSWORD:  ${REDIS_PASSWORD}
      # entrypoint 的 envsubst 用,渲染进 config.toml 的 [Center] ScanopyToken
      SCANOPY_TOKEN:   ${SCANOPY_TOKEN:-}
      # 同样供 envsubst 渲染 config.toml 的 TopoStudioToken;必须与 topo-studio 的
      # TOPO_API_TOKEN 一致,否则 n9e 反代 topo 带空 token → topo 返回 401
      TOPO_API_TOKEN:  ${TOPO_API_TOKEN:-}
      # cfgsync 秘钥库 master key(n9e 进程直接 os.Getenv 读,不进 config.toml);
      # 未设则「新建秘钥」报错。务必备份:丢失/变更 → DB 密文全废。
      N9E_SECRET_MASTER_KEY: ${N9E_SECRET_MASTER_KEY:-}
      # 自然语言查询默认跟随已启用的默认 LLM；报告默认关闭，数据权限由后端核验。
      CONFIGTYPE_CENTER_NATURALQUERY_ENABLED: ${O9E_NATURAL_QUERY_ENABLED:-true}
      CONFIGTYPE_CENTER_NATURALQUERY_TTLSECONDS: ${O9E_NATURAL_QUERY_TTL_SECONDS:-900}
      CONFIGTYPE_CENTER_NATURALQUERY_TIMEOUTSECONDS: ${O9E_NATURAL_QUERY_TIMEOUT_SECONDS:-90}
      CONFIGTYPE_CENTER_NATURALQUERY_MAXACTIVE: ${O9E_NATURAL_QUERY_MAX_ACTIVE:-128}
      CONFIGTYPE_CENTER_REPORTS_ENABLED: ${O9E_REPORTS_ENABLED:-false}
      CONFIGTYPE_CENTER_REPORTS_RETENTIONDAYS: ${O9E_REPORTS_RETENTION_DAYS:-90}
      CONFIGTYPE_CENTER_VOICE_ENABLED: ${O9E_VOICE_ENABLED:-false}
      CONFIGTYPE_CENTER_VOICE_GATEWAYURL: ${O9E_VOICE_GATEWAY_URL:-}
      CONFIGTYPE_CENTER_VOICE_CLIENTID: ${O9E_VOICE_CLIENT_ID:-o9e}
      CONFIGTYPE_CENTER_VOICE_DATASOURCEID: ${O9E_VOICE_DATASOURCE_ID:-0}
      CONFIGTYPE_CENTER_VOICE_MAXSECONDS: ${O9E_VOICE_MAX_SECONDS:-1200}
      O9E_VOICE_GATEWAY_TOKEN: ${O9E_VOICE_GATEWAY_TOKEN:-}
    volumes:
      # 只挂 .tpl 模板进去(只读),容器内 /app/etc 目录保持镜像里的拥有者,
      # entrypoint 才能 `envsubst > config.toml.tmp && mv` 渲染配置。
      # 整目录 bind mount 会把目录 owner 盖成宿主 root,容器内进程写不进去 → Permission denied。
      - ./etc/o9e/config.toml.tpl:/app/etc/config.toml.tpl:ro
      - n9e-logs:/app/logs
    networks: [n9e]
    # 覆盖镜像内置健康检查(启动宽限 20s + 4×15s ≈ 80s):全新部署首启要建 170+ 张表,
    # 2 核机实测约 4 分钟,内置值会判 unhealthy → 依赖它的 nginx 起不来。放宽到 5 分钟宽限 + 20×15s。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:17000/api/n9e/version || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 20
      start_period: 300s
    depends_on:
      # 外部数据库时内置 mysql 不启用,required: false 让依赖自动跳过
      mysql:           { condition: service_healthy, required: false }
      redis:           { condition: service_healthy }
      victoriametrics: { condition: service_healthy }
      scanopy:         { condition: service_healthy }
    expose:
      - "17000"
      - "20090"
    # 不再直接发布 17000:对外的 17000 由 nginx 接管,只放行 agent 接口(见 etc/nginx/templates/agent-api.conf.template),
    # 登录与管理 API 不经明文端口暴露。

  topo-studio:
    # 复用 n9e 镜像里的第二个二进制;覆盖 entrypoint 直接跑 topo-studio。
    # working_dir 必须是 /app/topo-studio:服务用相对路径加载 web/public 与 migrate SQL。
    image: fuqiangleon/o9e:${O9E_TAG:-latest}
    container_name: o9e-topo-studio
    restart: always
    working_dir: /app/topo-studio
    entrypoint: ["/app/topo-studio/bin/topo-studio"]
    environment:
      TZ: Asia/Shanghai
      TOPO_SERVER_HOST: "0.0.0.0"
      TOPO_SERVER_PORT: "38123"
      TOPO_API_TOKEN:   ${TOPO_API_TOKEN:-}
      # 与 n9e 用同一个数据库实例(DB_TYPE / DB_HOST / DB_PORT),库名与账号独立
      TOPO_STORE_DRIVER: ${DB_TYPE:-mysql}
      TOPO_DB_HOST: ${DB_HOST:-mysql}
      TOPO_DB_PORT: ${DB_PORT:-3306}
      TOPO_DB_NAME: ${TOPO_DB_NAME:-topo_studio}
      # PG / 金仓连接参数(MySQL 不使用):sslmode 与 n9e 一致
      TOPO_DB_PG_PARAMS: sslmode=${DB_SSLMODE:-prefer}
      TOPO_DB_USER: ${TOPO_DB_USER}
      TOPO_DB_PASS: ${TOPO_DB_PASSWORD}
      TOPO_DB_MIGRATE: "true"
      SCANOPY_URL: http://scanopy:60072
      SCANOPY_TOKEN: ${SCANOPY_TOKEN:-}
      # 嵌入全应用(organizations/SSE 需 user context)用的服务用户会话凭据。
      # 复用 bootstrap 已配的 admin 账号,无需另加密钥。
      SCANOPY_SESSION_EMAIL:    ${SCANOPY_ADMIN_EMAIL:-}
      SCANOPY_SESSION_PASSWORD: ${SCANOPY_ADMIN_PASSWORD:-}
    networks: [n9e]
    depends_on:
      mysql:   { condition: service_healthy, required: false }
      scanopy: { condition: service_healthy }
    expose:
      - "38123"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:38123/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ─── 日志监控:Logstash 收 nprobe NetFlow → Elasticsearch,n9e 日志探索查 ───
  # 镜像走 docker.elastic.co(1ms 不代理),本机需经代理拉。
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.15.3}
    container_name: o9e-elasticsearch
    restart: always
    environment:
      TZ: Asia/Shanghai
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      # 单机内网部署:安全开启(basic auth)但关 HTTP/transport TLS,简化对接
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      bootstrap.memory_lock: "true"
      # heap 按宿主内存调,建议 ≤ 物理内存一半
      ES_JAVA_OPTS: -Xms${ES_HEAP_SIZE:-2g} -Xmx${ES_HEAP_SIZE:-2g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [n9e]
    expose:
      - "9200"
    healthcheck:
      # ES 首启慢(初始化 + security bootstrap),start_period 给足
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health' | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  logstash:
    image: docker.elastic.co/logstash/logstash:${ES_VERSION:-8.15.3}
    container_name: o9e-logstash
    restart: always
    environment:
      TZ: Asia/Shanghai
      LS_JAVA_OPTS: -Xms${LS_HEAP_SIZE:-1g} -Xmx${LS_HEAP_SIZE:-1g}
      # pipeline 的 elasticsearch output 引用它做 basic auth
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      # 不要在此用 env 设 xpack.* 等 logstash.yml setting:Logstash entrypoint 会把
      # 这类 env 回写进 logstash.yml,而它是 :ro 挂载 → "read-only file system" 启动崩。
      # xpack.monitoring.enabled 已写在 config/logstash.yml。
    volumes:
      - ./etc/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./etc/logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks: [n9e]
    depends_on:
      elasticsearch: { condition: service_healthy }
    # NetFlow 入口:远端 agent 的 nprobe 送到 <部署机IP>:5044(NPROBE_COLLECTOR)
    ports:
      - "${NETFLOW_PORT:-5044}:5044/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  nginx:
    image: nginx:1.25-alpine
    container_name: o9e-nginx
    restart: always
    environment:
      TZ: Asia/Shanghai
      # auto-cert.sh 用,缺证书自动签时的 CN/SAN 来源(优先用配置的域名,否则 o9e.local)
      AUTO_CERT_CN: ${N9E_DOMAIN:-o9e.local}
      # 17000 agent 接口入口:1=非 agent 接口返回 403(默认,6456 实测 14 台 agent 请求全在放行列表);
      # 0=只记录不拦截(排障时用)
      AGENT_API_ENFORCE: ${AGENT_API_ENFORCE:-1}
      # 模板渲染到 /etc/nginx(conf.d 是只读挂载,写不进去)
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./etc/nginx/templates:/etc/nginx/templates:ro
      - ./logs/nginx:/var/log/agent-api
      - ./etc/nginx/conf.d:/etc/nginx/conf.d:ro
      # tls 目录不能 :ro — auto-cert.sh 缺证书时需要在这里写入新生成的 fullchain/privkey
      - ./etc/tls:/etc/nginx/tls
      # nginx 镜像的 /docker-entrypoint.d/*.sh 会被主 entrypoint 自动 source,
      # 在 nginx -g 启动前跑;05- 前缀让它在内置 10-listen-on-ipv6 之前执行。
      - ./etc/nginx/auto-cert.sh:/docker-entrypoint.d/05-auto-cert.sh:ro
    ports:
      # 对外只开 443。80 仅做跳转、20090 是 ibex 远程执行(agent 未启用),默认只绑本机;
      # 需要时在 .env 设 HTTP_BIND / IBEX_RPC_BIND=0.0.0.0。
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${IBEX_RPC_BIND:-127.0.0.1}:${IBEX_RPC_PORT:-20090}:20090"
      # agent 上报入口(只放行 agent 接口)
      - "${AGENT_API_PORT:-17000}:17000"
    # 只等 n9e 容器启动,不等健康:nginx 只是反代,n9e 未就绪时短暂返回 502 即可。
    # 等健康会让全新部署(n9e 首启建表数分钟)时 compose up 判依赖失败、nginx 停在 created(6456 两轮实测)。
    depends_on:
      n9e: { condition: service_started }
    networks: [n9e]
